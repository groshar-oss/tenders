/* ---------- Drive: נתונים ---------- */
const gq=s=>String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
async function ggList(q,fields){return ((await (await ggFetch(GAPI+'files?spaces=drive&pageSize=100&q='+encodeURIComponent(q)+'&fields='+encodeURIComponent('files('+fields+')'))).json()).files)||[];}
async function ggAlive(id){if(!id)return false;try{const m=await (await ggFetch(GAPI+'files/'+id+'?fields=id,trashed')).json();return !m.trashed;}catch(e){if(e.message==='AUTH')throw e;return false;}}
async function ggFolder(name,parent){
  name=String(name||'ללא שם').replace(/[\\/]/g,'-').slice(0,100);
  const f=await ggList(`mimeType='${GFOLDER}' and name='${gq(name)}' and '${parent}' in parents and trashed=false`,'id');if(f.length)return f[0].id;
  return (await (await ggFetch(GAPI+'files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,mimeType:GFOLDER,parents:[parent]})})).json()).id;
}
async function ggRoot(){if(!(await ggAlive(GG.rootId))){GG.rootId=await ggFolder(GG.rootName||'ניהול מכרזים','root');GG.fileId='';GG.folders={};ggSave();}return GG.rootId;}
async function ggSubFolder(key,name,parent){const id=GG.folders[key];if(id&&await ggAlive(id))return id;GG.folders[key]=await ggFolder(name,parent);ggSave();return GG.folders[key];}
async function ggUpload(blob,meta){
  if(blob.size<=5*1024*1024){const fd=new FormData();fd.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));fd.append('file',blob);
    return (await ggFetch(GUP+'files?uploadType=multipart&fields=id,webViewLink,modifiedTime',{method:'POST',body:fd})).json();}
  const r=await ggFetch(GUP+'files?uploadType=resumable&fields=id,webViewLink,modifiedTime',{method:'POST',headers:{'Content-Type':'application/json; charset=UTF-8','X-Upload-Content-Type':meta.mimeType||'application/octet-stream'},body:JSON.stringify(meta)});
  const loc=r.headers.get('Location');if(!loc)throw new Error('העלאת קובץ גדול נכשלה');
  const r2=await fetch(loc,{method:'PUT',body:blob});if(!r2.ok)throw new Error('Drive '+r2.status);return r2.json();
}
const isEmptyState=()=>!S.projects.length&&!S.vendors.length;
async function ggPush(){
  const stamp=S.updatedAt||Date.now(),body=JSON.stringify(S);let m;
  if(GG.fileId)m=await (await ggFetch(GUP+'files/'+GG.fileId+'?uploadType=media&fields=id,modifiedTime',{method:'PATCH',headers:{'Content-Type':'application/json'},body})).json();
  else m=await ggUpload(new Blob([body],{type:'application/json'}),{name:GG_DATA,parents:[GG.rootId],mimeType:'application/json',description:'מסד הנתונים של מערכת ניהול המכרזים – אין למחוק'});

async function ggPull(meta){

  if(!o||!Array.isArray(o.projects))throw new Error('קובץ הנתונים ב-Drive אינו תקין');
  try{localStorage.setItem(KEY+'-before-drive',localStorage.getItem(KEY)||'');}catch(e){}
  ggPulling=true;try{localStorage.setItem(KEY,JSON.stringify(o));loadState();if(UI.pid&&!P(UI.pid))UI.pid=null;render();}finally{ggPulling=false;}

async function ggSync(mode){

    if(GG.fileId){try{meta=await (await ggFetch(GAPI+'files/'+GG.fileId+'?fields=id,modifiedTime,trashed')).json();if(meta.trashed)meta=null;}catch(e){if(e.message==='AUTH')throw e;meta=null;}}
    if(!meta){meta=(await ggList(`name='${GG_DATA}' and '${GG.rootId}' in parents and trashed=false`,'id,modifiedTime'))[0]||null;GG.fileId=meta?meta.id:'';}
    const remoteChanged=!!meta&&meta.modifiedTime!==GG.remoteMod,localChanged=(S.updatedAt||0)>(GG.syncedAt||0);

function allFileMetas(){const out=[];S.projects.forEach(p=>{p.files.forEach(f=>out.push({f,p,t:null}));p.tenders.forEach(t=>{t.files.forEach(f=>out.push({f,p,t}));t.bids.forEach(b=>(b.files||[]).forEach(f=>out.push({f,p,t})));});});return out;}

      const pf=await ggSubFolder('p:'+p.id,p.name,GG.rootId);
      const parent=t?await ggSubFolder('t:'+t.id,t.name||'מכרז',pf):pf;
      const m=await ggUpload(rec.blob,{name:f.name,parents:[parent],mimeType:rec.type||f.type||'application/octet-stream',description:`${p.name}${t?' | '+t.name:''}${f.rev?' | '+f.rev:''}`});
      f.driveId=m.id;f.webLink=m.webViewLink||'';done[f.id]={id:m.id,link:f.webLink};n++;
    }
  }catch(e){if(e.message==='AUTH')ggToken=null;else{GG.lastErr=e.message;toast('העלאת קבצים ל-Drive נכשלה: '+e.message,5000);}}
  finally{ggFilesBusy=false;if(n){S.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}ggSchedule();toast(n===1?'קובץ הועלה ל-Google Drive':n+' קבצים הועלו ל-Google Drive');}ggUI();}
}
/* קובץ שלא נמצא בדפדפן (למשל במחשב אחר) – הורדה מ-Drive ושמירה מקומית */
async function ggFetchFile(id){
  const x=findFileMeta(id);if(!x||!x.f.driveId||!ggLive())return null;
  const blob=await (await ggFetch(GAPI+'files/'+x.f.driveId+'?alt=media')).blob();
  const rec={id,name:x.f.name,type:x.f.type||blob.type,blob,addedAt:x.f.addedAt||Date.now()};try{await FDB.put(rec);}catch(e){}
  return rec;
}
function ggTrash(fid){const x=findFileMeta(fid);if(x&&x.f.driveId&&!allFileMetas().some(y=>y.f.id===fid&&y.f!==x.f)){GG.trash.push(x.f.driveId);ggSave();}}

/* ---------- Gmail: שליחה ---------- */
async function gmailSend(it){
  const blob=await buildEml({to:it.to,subject:it.subject,body:it.body,attachments:it.att||[],forSend:true});
  if(blob.size>35*1024*1024)throw new Error('ההודעה עם הקבצים גדולה מ-35MB');
  const r=await ggFetch('https://gmail.googleapis.com/upload/gmail/v1/users/me/messages/send?uploadType=media',{method:'POST',headers:{'Content-Type':'message/rfc822'},body:blob});
  return r.json();
}
/* ---------- Gmail: קליטת הצעות מתיבת הדואר ---------- */
const b64url=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return s;};
const b64urlText=s=>{try{return new TextDecoder('utf-8').decode(Uint8Array.from(atob(b64url(s)),c=>c.charCodeAt(0)));}catch(e){return '';}};
const b64urlBlob=(s,type)=>new Blob([Uint8Array.from(atob(b64url(s)),c=>c.charCodeAt(0))],{type});
function walkParts(p,out){if(!p)return out;if(p.filename&&p.body&&(p.body.attachmentId||p.body.data))out.att.push(p);
  else if(p.mimeType==='text/plain'&&p.body&&p.body.data)out.plain+=b64urlText(p.body.data)+'\n';
  else if(p.mimeType==='text/html'&&p.body&&p.body.data)out.html+=b64urlText(p.body.data);
  (p.parts||[]).forEach(x=>walkParts(x,out));return out;}
async function gmailScanTender(t){
  if(!gmailReadReady())return toast('יש להתחבר ל-Gmail (כפתור Google למעלה)',4500);
  const vs=t.invitees.map(i=>V(i.vendorId)).filter(v=>v&&v.email);
  if(!vs.length)return toast('אין במכרז ספקים עם כתובת מייל');
  const since=Math.min(t.created||Date.now(),...t.invitees.filter(i=>i.rfqAt).map(i=>i.rfqAt));const d=new Date(since-864e5);
  const q=`from:(${vs.map(v=>v.email).join(' OR ')}) after:${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} -in:sent -in:chats`;
  toast('בודק את תיבת ה-Gmail…',8000);
  let list=[];try{list=((await (await ggFetch(GMAIL+'messages?maxResults=40&q='+encodeURIComponent(q))).json()).messages)||[];}catch(e){return toast('קריאת Gmail נכשלה: '+e.message,5000);}
  t.gmailSeen=t.gmailSeen||[];const fresh=list.filter(m=>!t.gmailSeen.includes(m.id));
  if(!fresh.length)return toast(list.length?'אין מיילים חדשים מהספקים מאז הבדיקה הקודמת':'לא נמצאו מיילים מהספקים של המכרז',5000);
  const cands=[];
  for(const m of fresh.slice(0,20)){
    try{
      const msg=await (await ggFetch(GMAIL+'messages/'+m.id+'?format=full')).json();
      const H=n=>((msg.payload.headers||[]).find(h=>h.name.toLowerCase()===n)||{}).value||'';
      const parts=walkParts(msg.payload,{plain:'',html:'',att:[]});
      let body=parts.plain||parts.html.replace(/<br\s*\/?>/gi,'\n').replace(/<\/p>/gi,'\n').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ');
      body=body.split(/\n(?:On .{5,80}wrote:|ב-.{5,80}כתב\/ה:|-{2,}\s*Original Message|From:\s.+\nSent:)/)[0];
      const files=[];let extra='';
      for(const a of parts.att.slice(0,6)){
        const data=a.body.data||(await (await ggFetch(GMAIL+'messages/'+m.id+'/attachments/'+a.body.attachmentId)).json()).data;
        const blob=b64urlBlob(data,a.mimeType||guessType(a.filename));
        files.push(await storeFile(new File([blob],a.filename,{type:blob.type}),{kind:'bid',rev:t.curRev}));
        if(/\.pdf$/i.test(a.filename)){try{extra+='\n'+(await pdfText(blob)).text.slice(0,15000);}catch(e){}}
      }
      const text=`From: ${H('from')}\nSubject: ${H('subject')}\nDate: ${H('date')}\n\n${body}${extra}`;
      const r=parseBidText(text,bidVendors(t));if(!r.receivedAt&&msg.internalDate)r.receivedAt=iso(+msg.internalDate);
      cands.push({text,r,files,gmailId:m.id});
    }catch(e){if(e.message==='AUTH')return toast('פג תוקף החיבור ל-Google – התחברו מחדש',5000);console.error(e);}
  }
  SC={cands,text:'',gmail:true};renderScan();
}

/* ---------- ממשק ---------- */
function googleCard(){
  const [k,t]=ggState();const https=location.protocol!=='file:';
  return `<div class="card"><div class="card-h"><h3>☁️ Google Drive ו-Gmail</h3></div><div class="card-b grid">
    <div class="mini">אותו חיבור כמו במערכת התזרים. ב-Drive נשמרים כל הנתונים והקבצים (בתיקייה נפרדת), וב-Gmail המיילים נשלחים ישירות מהחשבון שלך, כולל קבצים מצורפים, ותשובות הספקים נקלטות מהתיבה.</div>
    <div id="ggStateTxt" class="mini"><span class="dot${k==='off'?'':' '+k}"></span> ${esc(t)}</div>
    ${https?'':'<div class="note">ההתחברות ל-Google עובדת רק מהאתר ב-GitHub Pages (כתובת https), לא מקובץ שנפתח ישירות מהמחשב.</div>'}
    <div class="fields"><div style="grid-column:span 2"><label class="f">OAuth Client ID</label><input class="i" id="ggCid" dir="ltr" value="${esc(GG.clientId)}" placeholder="1234567890-abc….apps.googleusercontent.com"></div>
      <div><label class="f">שם התיקייה ב-Drive</label><input class="i" id="ggRoot" value="${esc(GG.rootName)}" ${GG.rootId?'disabled':''}></div></div>
    <div class="row"><label class="chk"><input type="checkbox" id="ggDrive" ${GG.drive?'checked':''}> סנכרון נתונים וקבצים ל-Google Drive</label><label class="chk"><input type="checkbox" id="ggGmail" ${GG.gmail?'checked':''}> חיבור ל-Gmail (שליחה וקריאת תשובות)</label></div>
    <div class="row"><button class="btn pri" data-act="gg-connect">${GG.enabled&&ggLive()?'סנכרון עכשיו':'התחברות ל-Google'}</button>
      ${GG.enabled&&GG.drive?'<button class="btn" data-act="gg-push">⬆️ שמירה ל-Drive</button><button class="btn" data-act="gg-pull">⬇️ טעינה מ-Drive</button>':''}
      ${GG.enabled?'<div class="spacer"></div><button class="btn ghost danger" data-act="gg-off">ניתוק</button>':''}</div></div></div>`;
}
const GG_ACT={
  'gg-top':()=>{if(GG.enabled&&GG.clientId&&!ggLive()&&location.protocol!=='file:')ggConnect();else go('set');},
  'gg-connect':async()=>{if(GG.enabled&&ggLive()&&(!$('#ggDrive')||($('#ggDrive').checked===GG.drive&&$('#ggGmail').checked===GG.gmail))){await ggSync('auto');await ggSyncFiles();render();}else await ggConnect();},
  'gg-push':async()=>{if(!ggLive())return toast('יש להתחבר קודם');await ggSync('push');await ggSyncFiles();if(!GG.lastErr)toast('נשמר ל-Google Drive');},
  'gg-pull':async()=>{if(!ggLive())return toast('יש להתחבר קודם');if(confirm('לטעון את הנתונים מ-Google Drive במקום הנתונים שבדפדפן? (הגרסה המקומית תישמר כגיבוי)'))await ggSync('pull');},
  'gg-off':()=>ggDisconnect(),
  'gmail-scan':()=>gmailScanTender(curT())
};
function ggBoot(){ggUI();if(GG.enabled)setTimeout(()=>toast('Google: לחצו על כפתור Google למעלה כדי לחדש את החיבור (Drive / Gmail)',5000),1500);}

</script>
