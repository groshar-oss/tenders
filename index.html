<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ניהול מכרזים – פרויקטי גמר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f9; --panel:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --brand:#1d4ed8; --brand-soft:#eef2ff; --pos:#047857; --pos-soft:#ecfdf5;
  --neg:#b91c1c; --neg-soft:#fef2f2; --warn:#b45309; --warn-soft:#fffbeb;
  --radius:14px; --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px -12px rgba(15,23,42,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Heebo',"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
a{color:var(--brand)}
button{font-family:inherit}
.wrap{max-width:1500px;margin:0 auto;padding:0 18px 56px}

/* ---------- top bar ---------- */
.topbar{background:#0b1220;color:#fff;border-bottom:1px solid #16203a}
.topbar-in{max-width:1500px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#0ea5e9);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.topbar h1{font-size:16px}
.topbar .sub{color:#93a3b8;font-size:12px}
.spacer{flex:1}
.proj-name{background:transparent;border:1px solid #273449;color:#fff;border-radius:9px;padding:6px 10px;font-size:13px;min-width:200px}
.proj-name option{color:#0f172a}
.proj-name:disabled{opacity:.45}
.proj-name:focus{outline:2px solid #2563eb55;border-color:#2563eb}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:16px 0 14px;background:var(--panel);padding:6px;border-radius:12px;border:1px solid var(--line);box-shadow:var(--shadow)}
.tab{border:0;background:transparent;padding:9px 15px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:7px}
.tab:hover{background:#f1f5f9;color:var(--ink)}
.tab.active{background:var(--brand);color:#fff}
.tab .cnt{background:#0000000f;border-radius:20px;padding:0 7px;font-size:11px}
.tab.active .cnt{background:#ffffff33}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card-h h3{font-size:15px}
.card-h .hint{color:var(--muted);font-size:12px}
.card-b{padding:16px 18px}
.grid{display:grid;gap:14px;min-width:0}
.grid>*{min-width:0}
section{min-width:0}

/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--brand)}
.kpi.pos:before{background:var(--pos)} .kpi.neg:before{background:var(--neg)} .kpi.warn:before{background:var(--warn)}
.kpi .lbl{color:var(--muted);font-size:12px;font-weight:500}
.kpi .val{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .foot{font-size:11.5px;color:var(--muted);margin-top:3px}
.kpi.pos .val{color:var(--pos)} .kpi.neg .val{color:var(--neg)}

/* ---------- tables ---------- */
.tbl-scroll{overflow:auto;max-width:100%;min-width:0;-webkit-overflow-scrolling:touch}
.card{min-width:0}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.t th,table.t td{padding:9px 11px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
table.t thead th{background:#f8fafc;font-weight:600;color:#334155;font-size:12px;position:sticky;top:0;z-index:2}
table.t tbody tr:hover{background:#f8fbff}
table.t tfoot td{background:#f1f5f9;font-weight:700;border-top:2px solid #cbd5e1}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--muted)}
tr.gap{background:var(--neg-soft)!important}
tr.gap td:first-child{font-weight:600}
tr.now td{box-shadow:inset 0 0 0 2px #2563eb22}
.sticky-first th:first-child,.sticky-first td:first-child{position:sticky;inset-inline-start:0;background:var(--panel);z-index:1}
.sticky-first thead th:first-child{background:#f8fafc;z-index:3}
.sticky-first tfoot td:first-child{background:#f1f5f9}

/* ---------- controls ---------- */
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 13px;border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#f8fafc;border-color:#cbd5e1}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:#1a43bb}
.btn.ok{background:var(--pos);border-color:var(--pos);color:#fff}
.btn.danger{color:var(--neg);border-color:#fecaca;background:#fff}
.btn.danger:hover{background:var(--neg-soft)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:#f1f5f9;color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:7px 13px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink)}
input.i:focus,select.i:focus,textarea.i:focus{outline:2px solid #2563eb22;border-color:var(--brand)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:500;background:#f1f5f9;color:#475569;white-space:nowrap}
.chip.b{background:var(--brand-soft);color:var(--brand)}
.chip.g{background:var(--pos-soft);color:var(--pos)}
.chip.r{background:var(--neg-soft);color:var(--neg)}
.chip.y{background:var(--warn-soft);color:var(--warn)}
.note{background:var(--warn-soft);border:1px solid #fde68a;color:#78350f;border-radius:11px;padding:10px 13px;font-size:12.5px}
.info{background:var(--brand-soft);border:1px solid #c7d2fe;color:#1e3a8a;border-radius:11px;padding:10px 13px;font-size:12.5px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .big{font-size:26px;margin-bottom:6px}
.dot{width:9px;height:9px;border-radius:50%;background:#94a3b8;display:inline-block}
.dot.ok{background:var(--pos)}.dot.wait{background:var(--warn)}.dot.err{background:var(--neg)}
.pc{font-size:11.5px;color:var(--muted);line-height:1.5}
.pc a{color:var(--brand);text-decoration:none}
.bank{font-size:12px;line-height:1.5;white-space:nowrap}
.sec-t{font-size:12.5px;font-weight:700;color:var(--ink);margin:16px 0 8px;padding-top:12px;border-top:1px dashed var(--line)}
.sugg{margin-top:10px;background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:11px;padding:9px 12px;font-size:12.5px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.flist{display:grid;gap:6px}
.frow{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12.5px}
.frow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fview{width:100%;height:min(72vh,820px);border:0;border-radius:9px;background:#f1f5f9}

/* ---------- drop zone ---------- */
.dz{border:2px dashed #cbd5e1;border-radius:var(--radius);padding:22px;text-align:center;background:#fcfdff;cursor:pointer}
.dz:hover,.dz.over{border-color:var(--brand);background:var(--brand-soft)}
.dz .ic{font-size:26px}
.dz .t{font-weight:600;margin-top:6px}
.dz .s{color:var(--muted);font-size:12px;margin-top:2px}
.dz-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:#0f172acc;display:none;align-items:flex-start;justify-content:center;padding:28px 14px;z-index:60;overflow:auto}
.ov.on{display:flex}
.modal{background:var(--panel);border-radius:16px;width:100%;max-width:760px;box-shadow:0 24px 60px -12px #0f172a66;animation:pop .14s ease-out}
.modal.wide{max-width:1180px}
@keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
.modal-h{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal-h h3{font-size:16px;flex:1}
.modal-b{padding:18px 20px;max-height:min(70vh,760px);overflow:auto}
.modal-f{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-start;background:#fafbfd;border-radius:0 0 16px 16px}
.x{border:0;background:#f1f5f9;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;color:#475569}
.toast{position:fixed;inset-block-end:18px;inset-inline-start:18px;background:#0b1220;color:#fff;padding:11px 16px;border-radius:11px;font-size:13px;z-index:90;box-shadow:var(--shadow);display:none}
.toast.on{display:block;animation:pop .15s}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{height:7px;background:#e2e8f0;border-radius:20px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);width:0;transition:width .2s}
.chart-box{position:relative;height:330px}
.chart-box.sm{height:260px}
details.acc{border:1px solid var(--line);border-radius:11px;padding:0;overflow:hidden}
details.acc>summary{padding:11px 14px;cursor:pointer;font-weight:600;font-size:13.5px;background:#f8fafc;list-style:none}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary:before{content:"▾";margin-inline-end:7px;color:var(--muted);display:inline-block;transition:transform .15s}
details.acc:not([open])>summary:before{transform:rotate(90deg)}
details.acc .in{padding:14px}
.ti{width:100%;min-width:60px;padding:5px 7px;font-size:12.5px;font-family:inherit;border:1px solid transparent;background:transparent;border-radius:7px;color:var(--ink)}
.ti:hover{border-color:var(--line);background:#fff}
.ti:focus{border-color:var(--brand);background:#fff;outline:2px solid #2563eb22}
select.ti{cursor:pointer}
.ti.num{text-align:left;direction:ltr}
tr.grp td{background:#eef2f7!important;font-weight:600;border-top:2px solid #cbd5e1}
.chip.xs{font-size:10px;padding:1px 6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-inline-end:5px;vertical-align:-1px}

@media(max-width:720px){
  .card-b{padding:13px}
  .topbar h1{font-size:15px}
  .kpi .val{font-size:19px}
}
@media print{
  body{background:#fff}
  .topbar,.tabs,.no-print,.btn,.seg{display:none!important}
  .card{box-shadow:none;border-color:#cbd5e1;break-inside:avoid}
  .chart-box{height:260px}
  table.t th,table.t td{padding:5px 7px;font-size:11px}
  .wrap{padding:0;max-width:none}
  @page{size:landscape;margin:10mm}
}

/* =====================================================================
   תוספות – מערכת ניהול מכרזים
   ===================================================================== */
.logo.t{background:linear-gradient(135deg,#7c3aed,#2563eb)}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:2px 0 10px}
.crumbs a{cursor:pointer;text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.col2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
@media(max-width:980px){.col2{grid-template-columns:minmax(0,1fr)}}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.pcard{padding:16px 18px;display:grid;gap:10px;cursor:default}
.pcard h3{font-size:15.5px}
.pcard .meta{color:var(--muted);font-size:12px}
.pcard .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12px}
.pcard .nums b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.pcard.arch{opacity:.75;background:#f8fafc}
.sbar{display:flex;height:8px;border-radius:20px;overflow:hidden;background:#e2e8f0}
.sbar i{display:block;height:100%}
.s-draft{background:#94a3b8}.s-pend_dist{background:#f59e0b}.s-dist{background:#3b82f6}.s-collect{background:#6366f1}.s-pend_award{background:#d97706}.s-closed{background:#059669}.s-cancel{background:#ef4444}
.lgd{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.lgd i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-inline-end:4px;vertical-align:-1px}
.todo{display:grid;gap:7px}
.todo .it{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;background:#fff}
.todo .it .tx{flex:1;min-width:0}
.todo .it .tx small{display:block;color:var(--muted);font-size:11.5px}

/* stepper */
.stepper{display:flex;gap:0;overflow:auto;padding:4px 0}
.stp{flex:1;min-width:112px;text-align:center;position:relative;font-size:12px;color:var(--muted);padding-top:30px}
.stp:before{content:"";position:absolute;top:12px;inset-inline-start:50%;width:100%;height:3px;background:#e2e8f0;z-index:0}
.stp:last-child:before{display:none}
.stp i{position:absolute;top:2px;inset-inline-start:calc(50% - 12px);width:24px;height:24px;border-radius:50%;background:#e2e8f0;color:#64748b;font-style:normal;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:12px;z-index:1}
.stp.done{color:var(--ink)} .stp.done i{background:var(--pos);color:#fff} .stp.done:before{background:#6ee7b7}
.stp.cur{color:var(--brand);font-weight:700} .stp.cur i{background:var(--brand);color:#fff;box-shadow:0 0 0 4px #2563eb33}
.stp.wait i{background:#f59e0b}
.th-head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.th-head h2{font-size:20px}
.th-head .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.subtabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:0 12px;background:#fafbfd;border-radius:var(--radius) var(--radius) 0 0}
.subtabs button{border:0;background:transparent;padding:11px 13px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center}
.subtabs button:hover{color:var(--ink)}
.subtabs button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.subtabs .cnt{background:#e2e8f0;border-radius:20px;padding:0 7px;font-size:10.5px;color:#475569}
.gate{border:1px solid #fde68a;background:var(--warn-soft);border-radius:12px;padding:12px 14px;display:grid;gap:9px}
.gate.ok{border-color:#a7f3d0;background:var(--pos-soft)}
.gate.blue{border-color:#c7d2fe;background:var(--brand-soft)}
.gate h4{font-size:13.5px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}
textarea.i{min-height:90px;resize:vertical;line-height:1.55}
textarea.i.tall{min-height:300px;font-size:13px}
textarea.i.mono{font-family:Consolas,"Courier New",monospace;font-size:12px}
.auto{background:#fefce8!important;border-color:#facc15!important}
.timeline{display:grid;gap:0;position:relative;padding-inline-start:20px}
.timeline:before{content:"";position:absolute;inset-inline-start:6px;top:4px;bottom:4px;width:2px;background:#e2e8f0}
.tl{position:relative;padding:6px 0 10px;font-size:13px}
.tl:before{content:"";position:absolute;inset-inline-start:-19px;top:11px;width:10px;height:10px;border-radius:50%;background:#94a3b8;border:2px solid #fff;box-shadow:0 0 0 1px #cbd5e1}
.tl.status:before{background:var(--brand)} .tl.approval:before{background:var(--warn)} .tl.award:before{background:var(--pos)} .tl.mail:before{background:#0ea5e9} .tl.rev:before{background:#7c3aed} .tl.bid:before{background:#6366f1} .tl.reject:before{background:var(--neg)}
.tl .when{color:var(--muted);font-size:11.5px}
td.hi{background:#fee2e2!important;color:#991b1b;font-weight:600}
td.lo{background:#fef3c7!important;color:#92400e;font-weight:600}
td.miss{background:#f1f5f9!important;color:#94a3b8;font-style:italic}
td.best{background:#dcfce7!important;color:#166534;font-weight:700}
td.win,th.win{box-shadow:inset 0 0 0 2px #059669}
.bars{display:grid;gap:8px}
.bars .b{display:grid;grid-template-columns:150px 1fr 110px;gap:10px;align-items:center;font-size:12.5px}
.bars .trk{position:relative;height:20px;background:#f1f5f9;border-radius:6px}
.bars .trk>i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:6px;background:#93c5fd}
.bars .trk>i.w{background:#34d399}
.bars .trk>i.o{background:#fca5a5}
.bars .trk>u{position:absolute;inset-block:-4px;width:2px;background:#0f172a;text-decoration:none}
.bars .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:620px){.bars .b{grid-template-columns:90px 1fr 80px}}
.ins{display:grid;gap:6px}
.ins .x1{display:flex;gap:9px;align-items:flex-start;font-size:12.8px;padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:#fff}
.ins .x1.r{border-color:#fecaca;background:#fff7f7}
.ins .x1.y{border-color:#fde68a;background:#fffdf3}
.ins .x1.g{border-color:#a7f3d0;background:#f5fffa}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:11.5px;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.cal .d{min-height:86px;border:1px solid var(--line);border-radius:9px;padding:5px;font-size:11px;background:#fff;overflow:hidden}
.cal .d.o{background:#f8fafc;color:#cbd5e1}
.cal .d.td{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.cal .d .n{font-weight:700;font-size:12px;margin-bottom:3px}
.cal .ev{display:block;border-radius:5px;padding:1px 5px;margin-bottom:2px;background:var(--brand-soft);color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cal .ev.late{background:var(--neg-soft);color:var(--neg)}
.cal .ev.soon{background:var(--warn-soft);color:var(--warn)}
.cal .ev.visit{background:#f3e8ff;color:#7c3aed}
@media(max-width:720px){.cal .d{min-height:58px}.cal .ev{font-size:9.5px}}
.ob-row{border:1px solid var(--line);border-radius:11px;padding:10px 12px;display:grid;gap:8px}
.ob-row.sent{background:#f6fef9;border-color:#a7f3d0}
.ob-row .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ob-row .top .who{flex:1;min-width:180px}
.ob-row .top .who small{display:block;color:var(--muted)}
.ob-list{display:grid;gap:8px}
.pill-ph{font-family:Consolas,monospace;font-size:11px;background:#f1f5f9;border-radius:6px;padding:1px 6px;margin:2px;display:inline-block;cursor:copy}
.chk{display:flex;gap:7px;align-items:center;font-size:13px;cursor:pointer}

<script>
'use strict';
/* ---------- פונקציות עזר כלליות ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const uid=(p='id')=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isNum=v=>v!==null&&v!==undefined&&v!==''&&!isNaN(+v)&&isFinite(+v);
const money=v=>isNum(v)?'₪'+Math.round(+v).toLocaleString('he-IL'):'—';
const money2=v=>isNum(v)?'₪'+(+v).toLocaleString('he-IL',{minimumFractionDigits:0,maximumFractionDigits:2}):'—';
const nfmt=v=>isNum(v)?(+v).toLocaleString('he-IL',{maximumFractionDigits:2}):'—';
const pctf=(v,d=1)=>isNum(v)?((+v>0?'+':'')+(+v).toFixed(d)+'%'):'—';
function toNum(v){
  if(typeof v==='number') return v;
  if(v==null) return NaN;
  let s=String(v).replace(/ש"ח|ש״ח|שח|NIS|ILS|₪|\s/g,'');
  if(/^-?[\d.]+,\d{1,2}$/.test(s)) s=s.replace(/\./g,'').replace(',','.'); // 1.234,50
  s=s.replace(/,/g,'');
  const n=parseFloat(s);
  return isNaN(n)?NaN:n;
}
const numOrNull=v=>{const n=toNum(v);return isNaN(n)?null:n;};
const sum=a=>a.reduce((s,x)=>s+(+x||0),0);
function median(a){const v=a.filter(isNum).map(Number).sort((x,y)=>x-y);if(!v.length)return null;const m=v.length>>1;return v.length%2?v[m]:(v[m-1]+v[m])/2;}
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');};
const today=()=>iso(new Date());
const fdate=d=>{if(!d)return '—';const x=new Date(String(d).length===10?d+'T00:00':d);return isNaN(x)?'—':x.toLocaleDateString('he-IL');};
const fdt=ts=>ts?new Date(ts).toLocaleString('he-IL',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
function daysTo(d){if(!d)return null;const t=new Date(String(d).slice(0,10)+'T00:00');const n=new Date(today()+'T00:00');return Math.round((t-n)/864e5);}
const daysSince=ts=>ts?Math.floor((Date.now()-new Date(ts))/864e5):null;
function addDays(d,n){const x=new Date(String(d).slice(0,10)+'T00:00');x.setDate(x.getDate()+n);return iso(x);}
function daysLabel(n){if(n==null)return '—';if(n===0)return 'היום';if(n===1)return 'מחר';if(n===-1)return 'אתמול';return n>0?`בעוד ${n} ימים`:`לפני ${-n} ימים`;}
function dlChip(d){const n=daysTo(d);if(n==null)return '<span class="chip">ללא מועד</span>';const c=n<0?'r':n<=3?'y':n<=10?'b':'';return `<span class="chip ${c}">${daysLabel(n)}</span>`;}
const fsize=b=>!b?'':b<1024?b+' B':b<1048576?(b/1024).toFixed(0)+' KB':(b/1048576).toFixed(1)+' MB';
function ficon(name,type){const n=(name||'').toLowerCase();
  if(/\.pdf$/.test(n)||/pdf/.test(type))return '📕';if(/\.(xlsx?|csv)$/.test(n))return '📗';if(/\.docx?$/.test(n))return '📘';
  if(/\.(png|jpe?g|gif|webp|bmp|heic)$/.test(n)||/^image/.test(type))return '🖼️';if(/\.(dwg|dxf)$/.test(n))return '📐';if(/\.(zip|rar|7z)$/.test(n))return '🗜️';if(/\.eml$/.test(n))return '✉️';return '📄';}
function guessType(name){const e=(name.split('.').pop()||'').toLowerCase();return ({pdf:'application/pdf',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',xls:'application/vnd.ms-excel',csv:'text/csv',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',doc:'application/msword',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',dwg:'application/acad',zip:'application/zip',txt:'text/plain'})[e]||'application/octet-stream';}
function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),ms||2800);}
function download(name,data,type){
  const blob=data instanceof Blob?data:new Blob([data],{type:type||'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}
const safeName=s=>String(s||'').replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').trim().slice(0,90)||'file';
async function copyText(s){try{await navigator.clipboard.writeText(s);return true;}catch(e){const ta=document.createElement('textarea');ta.value=s;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(_){}ta.remove();return ok;}}

/* ---------- חלון (modal) ---------- */
function openModal({title,body,foot='',wide=false,onMount}){
  const ov=$('#ov');
  ov.innerHTML=`<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true"><div class="modal-h"><h3>${title}</h3><button class="x" data-act="modal-close" aria-label="סגירה">✕</button></div><div class="modal-b">${body}</div>${foot?`<div class="modal-f">${foot}</div>`:''}</div>`;
  ov.classList.add('on');document.body.style.overflow='hidden';
  const m=ov.firstElementChild; if(onMount) onMount(m); return m;
}
function closeModal(){const ov=$('#ov');ov.classList.remove('on');ov.innerHTML='';document.body.style.overflow='';if(window._onModalClose){const f=window._onModalClose;window._onModalClose=null;f();}}

/* ---------- טעינת ספריות לפי צורך (CDN) ---------- */
const LIBS={
  pdf:{url:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',test:()=>window.pdfjsLib,
       after:()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}},
  zip:{url:'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',test:()=>window.JSZip},
  xlsx:{url:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',test:()=>window.XLSX}
};
function ensureLib(k){
  const L=LIBS[k]; if(L.test()) return Promise.resolve();
  if(L.p) return L.p;
  L.p=new Promise((res,rej)=>{const s=document.createElement('script');s.src=L.url;
    s.onload=()=>{try{L.after&&L.after();}catch(e){}res();};
    s.onerror=()=>{L.p=null;s.remove();rej(new Error('לא ניתן לטעון רכיב עזר ('+k+'). בדקו את החיבור לאינטרנט.'));};
    document.head.appendChild(s);});
  return L.p;
}
function pickFiles({accept='',multiple=true}={}){
  return new Promise(res=>{const inp=document.createElement('input');inp.type='file';inp.accept=accept;inp.multiple=multiple;
    inp.onchange=()=>res(Array.from(inp.files||[]));inp.click();});
}
function readText(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsText(file,'utf-8');});}

  if(inv.declined) return {k:'dec',l:'הודיע שלא יגיש',c:'r'};

  if(inv.rfqAt) return {k:'sent',l:'נשלחה פנייה',c:'b'};

function lastContact(inv){const r=inv.reminders||[];return r.length?r[r.length-1]:inv.rfqAt;}
function reminderDue(t,inv){
  if(!['dist','collect'].includes(t.status)) return false;
  if(!inv.rfqAt||inv.declined||bidOf(t,inv.vendorId)) return false;
  if(t.deadline&&daysTo(t.deadline)<0) return false;
  return daysSince(lastContact(inv))>=(+S.settings.reminderDays||3);
}
function pendingReplies(t){return t.invitees.filter(i=>i.rfqAt&&!i.declined&&!bidOf(t,i.vendorId));}
function tenderEstimate(t){if(isNum(t.estimate))return +t.estimate;const s=boqEstimate(t);return s||null;}
function boqEstimate(t){return sum(t.items.filter(i=>!i.chap).map(i=>(+i.qty||0)*(+i.est||0)));}
function awardedAmount(t){if(!t.award)return null;const b=t.bids.find(x=>x.id===t.award.bidId);return b?netTotal(b):null;}
function netTotal(b){if(!isNum(b.total))return null;return b.vatIncl?(+b.total)/(1+(+S.settings.vat||18)/100):+b.total;}
function projectStats(p){
  const ts=p.tenders;const by={};TORDER.concat('cancel').forEach(k=>by[k]=0);ts.forEach(t=>by[t.status]++);
  const est=sum(ts.filter(t=>t.status!=='cancel').map(t=>tenderEstimate(t)||0));
  const awd=sum(ts.filter(t=>t.status==='closed').map(t=>awardedAmount(t)||0));
  const estAw=sum(ts.filter(t=>t.status==='closed').map(t=>tenderEstimate(t)||0));
  const next=ts.filter(t=>['dist','collect','pend_dist','draft'].includes(t.status)&&t.deadline&&daysTo(t.deadline)>=0).sort((a,b)=>a.deadline.localeCompare(b.deadline))[0];
  return {by,est,awd,estAw,next,count:ts.length,active:ts.filter(t=>ACTIVE_ST.includes(t.status)).length};
}

/* ---------- אחסון קבצים בדפדפן (IndexedDB) ---------- */
const FDB={_p:null,
  open(){if(this._p)return this._p;this._p=new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('הדפדפן אינו תומך באחסון קבצים'));
    const r=indexedDB.open('tenders_mgmt_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});
    r.onsuccess=()=>res(r.result);r.onerror=()=>{this._p=null;rej(r.error);};});return this._p;},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction('files',mode);const rq=fn(tx.objectStore('files'));
    tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);});},
  put(rec){return this.tx('readwrite',s=>s.put(rec));},
  get(id){return this.tx('readonly',s=>s.get(id));},
  del(id){return this.tx('readwrite',s=>s.delete(id));},
  all(){return this.tx('readonly',s=>s.getAll());}
};

}

  String(tpl||'').split('\n').forEach(l=>{const had=/\{\{\w+\}\}/.test(l);
    const f=l.replace(/\{\{(\w+)\}\}/g,(m,k)=>ctx[k]!=null?String(ctx[k]):'').replace(/\s+$/,'');
    if(had&&/^[\s|·,.\-–]*$/.test(f))return;out.push(f.replace(/^\s*\|\s*|\s*\|\s*$/g,''));});

}

/* ---- EML (טיוטת מייל עם קבצים מצורפים, נפתחת ב-Outlook / Apple Mail) ---- */
const b64u=s=>{const bytes=new TextEncoder().encode(s);let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(bin);};
const wrap76=s=>s.replace(/(.{76})/g,'$1\r\n');
const encHdr=s=>/^[\x20-\x7e]*$/.test(s)?s:'=?UTF-8?B?'+b64u(s)+'?=';
async function blobB64(blob){const buf=new Uint8Array(await blob.arrayBuffer());let bin='';for(let i=0;i<buf.length;i+=0x8000)bin+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));return btoa(bin);}
async function buildEml({to,subject,body,attachments=[],forSend=false}){
  const B1='=_mix_'+Math.random().toString(36).slice(2),B2='=_alt_'+Math.random().toString(36).slice(2);
  const html=`<html><body dir="rtl" style="font-family:Arial,sans-serif;font-size:14px;direction:rtl;text-align:right">${esc(body).replace(/\n/g,'<br>')}</body></html>`;
  const from=!forSend&&S.settings.pmEmail?`From: ${encHdr(S.settings.pmName||'')} <${S.settings.pmEmail}>\r\n`:'';
  let out=`${from}To: ${to||''}\r\nSubject: ${encHdr(subject||'')}${forSend?'':'\r\nX-Unsent: 1'}\r\nMIME-Version: 1.0\r\nDate: ${new Date().toUTCString()}\r\nContent-Type: multipart/mixed; boundary="${B1}"\r\n\r\n`+
    `--${B1}\r\nContent-Type: multipart/alternative; boundary="${B2}"\r\n\r\n`+
    `--${B2}\r\nContent-Type: text/plain; charset=UTF-8\r\nContent-Transfer-Encoding: base64\r\n\r\n${wrap76(b64u(body||''))}\r\n`+
    `--${B2}\r\nContent-Type: text/html; charset=UTF-8\r\nContent-Transfer-Encoding: base64\r\n\r\n${wrap76(b64u(html))}\r\n--${B2}--\r\n`;
  for(const a of attachments){
    const blob=a.blob||await getBlob(a.id);if(!blob)continue;
    const nm=a.name||'file';const t=a.type||blob.type||guessType(nm);
    out+=`--${B1}\r\nContent-Type: ${t}; name="${encHdr(nm)}"\r\nContent-Transfer-Encoding: base64\r\nContent-Disposition: attachment; filename="${encHdr(nm)}"; filename*=UTF-8''${encodeURIComponent(nm)}\r\n\r\n${wrap76(await blobB64(blob))}\r\n`;
  }
  out+=`--${B1}--\r\n`;
  return new Blob([out],{type:'message/rfc822'});
}

/* ---------- יצירת קובץ Word (‎.docx) מטקסט, בכיוון ימין-לשמאל ---------- */
async function makeDocx(text){
  await ensureLib('zip');
  const x=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const lines=String(text).split('\n');
  const para=(s,{b=false,sz=22,jc='both',after=100}={})=>`<w:p><w:pPr><w:bidi/><w:spacing w:after="${after}" w:line="300" w:lineRule="auto"/><w:jc w:val="${jc}"/></w:pPr>${s?`<w:r><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>${b?'<w:b/><w:bCs/>':''}<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/><w:rtl/></w:rPr><w:t xml:space="preserve">${x(s)}</w:t></w:r>`:''}</w:p>`;
  let bodyX='';
  lines.forEach((l,i)=>{
    const s=l.replace(/\s+$/,'');
    if(i===0) bodyX+=para(s,{b:true,sz:32,jc:'center',after:120});
    else if(i===1&&s) bodyX+=para(s,{b:true,sz:24,jc:'center',after:240});
    else if(/^\d{1,2}\.\s/.test(s)) bodyX+=para(s,{b:true,sz:23,after:80});
    else bodyX+=para(s);
  });
  const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${bodyX}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="708" w:footer="708" w:gutter="0"/><w:bidi/></w:sectPr></w:body></w:document>`;
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial" w:eastAsia="Arial"/><w:sz w:val="22"/><w:szCs w:val="22"/><w:lang w:val="he-IL" w:bidi="he-IL"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:bidi/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:pPr><w:bidi/></w:pPr></w:style></w:styles>`;
  const z=new JSZip();
  z.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>');
  z.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  z.file('word/_rels/document.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>');
  z.file('word/document.xml',doc);z.file('word/styles.xml',styles);
  return z.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

/* ---------- חילוץ טקסט, תקציר אוטומטי, קליטת הצעות מטקסט מייל וכתבי כמויות ---------- */
async function pdfText(blob,maxPages=40){
  await ensureLib('pdf');
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise;
  const n=Math.min(pdf.numPages,maxPages);let out=[];
  for(let i=1;i<=n;i++){
    const pg=await pdf.getPage(i);const tc=await pg.getTextContent();
    const rows=[];
    tc.items.forEach(it=>{if(!it.str)return;const y=it.transform?it.transform[5]:0,x=it.transform?it.transform[4]:0;
      let r=rows.find(r=>Math.abs(r.y-y)<=3);if(!r){r={y,items:[]};rows.push(r);}r.items.push({x,w:it.width||0,s:it.str});});
    rows.sort((a,b)=>b.y-a.y);
    const lines=rows.map(r=>{const heb=r.items.some(i=>/[\u0590-\u05FF]/.test(i.s));
      r.items.sort((a,b)=>heb?(b.x+b.w)-(a.x+a.w):a.x-b.x);
      return r.items.reduce((acc,i)=>acc+(acc&&!/\s$/.test(acc)&&!/^\s/.test(i.s)?' ':'')+i.s,'');});
    let line='';
    if(line)lines.push(line);out.push(lines.map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean).join('\n'));
  }
  return {text:out.join('\n'),pages:pdf.numPages};
}
async function fileText(file){
  const n=(file.name||'').toLowerCase();
  if(/\.pdf$/.test(n)||file.type==='application/pdf'){const r=await pdfText(file);return r.text;}
  if(/\.(txt|eml|csv|htm|html)$/.test(n)||/^text/.test(file.type)){let s=await readText(file);if(/\.html?$/.test(n))s=s.replace(/<[^>]+>/g,' ');return s;}
  if(/\.(xlsx?|xls)$/.test(n)){await ensureLib('xlsx');const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});return wb.SheetNames.map(s=>XLSX.utils.sheet_to_csv(wb.Sheets[s],{FS:'\t'})).join('\n');}
  return '';
}

const DISCIPLINES=[
  ['מיזוג אוויר',/מיזוג|מזגנ|VRF|צ'ילר|יחידות טיפול|מפוח|תעלות/i],['חשמל',/חשמל|לוח חשמל|תאורה|גופי תאורה/],

  ['גבס ותקרות',/גבס|תקר(ה|ות) אקוסטי|תקרה מונמכת|מחיצ/],['ריצוף וחיפוי',/ריצוף|אריחים|פרקט|שטיח|חיפוי|פורצלן/],['נגרות',/נגרות|ארונות|דלתות עץ|דלפק/],
  ['אלומיניום וזכוכית',/אלומיניום|זכוכית|ויטרינ|מחיצות זכוכית/],['איטום',/איטום|יריעות|ממברנ/],['מתח נמוך ותקשורת',/מתח נמוך|תקשורת|מצלמות|בקרת כניסה|אינטרקום|כריזה|רשת מחשבים/],
  ['צבע',/צבע|טיח/],['הריסות ופירוקים',/הריס|פירוק/],['מסגרות',/מסגרות|פלדה|קונסטרוקצי/],['ריהוט',/ריהוט|כסאות|שולחנות|ריהוט משרדי/],['אקוסטיקה',/אקוסטי/],['נגישות',/נגישות/],['בטיחות',/בטיחות|ממונה בטיחות/]
];
/* תקציר מבוסס כללים – לא בינה מלאכותית אמיתית; התוצאה ניתנת לעריכה */
function autoSummary(text,fileName,pages){
  const T=String(text||'').replace(/\r/g,'');const flat=T.replace(/\s+/g,' ');
  const found={};
  const m1=flat.match(/(\d{1,3}(?:[,\d]{0,8})(?:\.\d+)?)\s*(?:מ"ר|מ״ר|מטר רבוע|מטרים רבועים|מ'"ר|sqm|m2|m²)/i);if(m1)found.area=m1[1];
  const m2=T.match(/(?:כתובת|ברחוב|רח'|רחוב)\s*[:\-]?\s*([^,.\n]{3,45})/);if(m2)found.address=m2[1].trim();
  const m3=flat.match(/(?:קומ(?:ה|ות))\s*[:\-]?\s*(\d{1,3}(?:\s*[-–]\s*\d{1,3})?)/);if(m3)found.floors=m3[1];
  const m4=T.match(/(?:שם הפרויקט|פרויקט)\s*[:\-]\s*([^\n.]{3,60})/);if(m4)found.project=m4[1].trim();
  const m5=T.match(/(?:המזמין|היזם|הלקוח|מזמין העבודה)\s*[:\-]\s*([^\n.,]{3,45})/);if(m5)found.client=m5[1].trim();
  const m6=flat.match(/(?:מועד (?:אחרון )?(?:ל)?הגשה|הגשת הצעות עד)[^\d]{0,25}(\d{1,2}[./]\d{1,2}[./]\d{2,4})/);if(m6)found.deadline=m6[1];
  const m7=flat.match(/(?:משך (?:ה)?ביצוע|לוח זמנים)[^\d]{0,20}(\d{1,3})\s*(ימים|ימי עבודה|שבועות|חודשים)/);if(m7)found.duration=m7[1]+' '+m7[2];
  const disc=DISCIPLINES.map(([n,re])=>[n,(T.match(new RegExp(re.source,'g'+(re.flags.includes('i')?'i':'')))||[]).length]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
  const kw=/פרויקט|עבודות|כולל|ביצוע|התאמה|משרדים|שטח|קומה|מערכות|הקמה|שיפוץ|גמר|ספק|הספקה|התקנה/;
  const sents=T.split(/(?<=[.!?:])\s+|\n+/).map(s=>s.trim()).filter(s=>s.length>=35&&s.length<=260&&/[א-ת]/.test(s)&&!/^\d+(\.\d+)*\s*$/.test(s));
  const scored=sents.map((s,i)=>({s,i,sc:(s.match(new RegExp(kw.source,'g'))||[]).length+disc.reduce((a,[n])=>a+(s.includes(n.split(' ')[0])?1:0),0)}))
    .filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,4).sort((a,b)=>a.i-b.i).map(x=>x.s);
  const parts=[];
  const facts=[];
  if(found.project)facts.push(`פרויקט: ${found.project}`);if(found.client)facts.push(`מזמין: ${found.client}`);
  if(found.address)facts.push(`כתובת: ${found.address}`);if(found.area)facts.push(`שטח: כ-${found.area} מ"ר`);if(found.floors)facts.push(`קומות: ${found.floors}`);
  if(found.duration)facts.push(`משך ביצוע: ${found.duration}`);
  if(facts.length)parts.push(facts.join(' · ')+'.');
  if(disc.length)parts.push('מערכות ותחומים עיקריים שזוהו במסמך: '+disc.slice(0,6).map(d=>d[0]).join(', ')+'.');
  if(scored.length)parts.push(scored.join(' '));
  if(!parts.length)parts.push(T.trim()?'לא זוהו פרטים מובנים במסמך. מומלץ להשלים את התקציר ידנית.':'לא נמצא טקסט במסמך (ייתכן שזו סריקה או תוכנית גרפית). יש להזין תקציר ידנית.');
  return {summary:parts.join('\n'),found,disciplines:disc.map(d=>d[0]),source:`${fileName||'מסמך'}${pages?` · ${pages} עמ'`:''}`};
}

/* חילוץ נתוני הצעה מטקסט מייל / PDF של ספק */
function parseBidText(text,cands){
  const T=String(text||'');const flat=T.replace(/\s+/g,' ');const r={};
  // ספק
  const emails=(T.match(/[\w.+-]+@[\w-]+\.[\w.-]+/g)||[]).map(e=>e.toLowerCase());
  let v=cands.find(v=>v.email&&emails.includes(v.email.toLowerCase()));
  if(!v)v=cands.find(v=>v.name&&flat.includes(v.name));
  if(!v)v=cands.find(v=>v.email&&emails.some(e=>e.split('@')[1]===v.email.toLowerCase().split('@')[1]&&!/gmail|walla|yahoo|hotmail|outlook/.test(e)));
  if(v)r.vendorId=v.id;
  // סכום
  const numRe=/(\d{1,3}(?:,\d{3})+(?:\.\d+)?|\d{4,}(?:\.\d+)?)/g;
  const lines=T.split(/\n/);let best=null;
  const keyRe=/סה"כ|סה״כ|סך הכל|סך הכול|סכום ההצעה|מחיר כולל|מחיר סופי|הצעתנו|הצעת המחיר|עלות כוללת|total/i;
  lines.forEach(l=>{if(keyRe.test(l)){const ns=(l.match(numRe)||[]).map(toNum).filter(n=>n>=500);ns.forEach(n=>{const vat=/כולל מע"מ|כולל מע״מ|כולל מעמ/.test(l)&&!/לא כולל/.test(l);if(!best||n>best.n||(best.vat&&!vat&&n>=best.n*0.8))best={n,vat,l};});}});
  if(!best){const ns=(flat.match(/(?:₪|ש"ח|ש״ח|NIS)\s*([\d,\.]+)|([\d,\.]{4,})\s*(?:₪|ש"ח|ש״ח|NIS)/g)||[]).map(s=>toNum(s.replace(/[^\d.,]/g,''))).filter(n=>n>=500);if(ns.length)best={n:Math.max(...ns)};}
  if(best){r.total=best.n;r.vatIncl=!!best.vat;}
  if(!r.vatIncl&&/(?:הסכום|המחיר|ההצעה)[^.\n]{0,25}כולל מע"מ/.test(flat)&&!/לא כולל מע"מ/.test(flat))r.vatIncl=true;
  const pt=flat.match(/שוטף\s*\+\s*\d{1,3}|שוטף\s*\d{1,3}|מזומן|מקדמה\s*(?:של\s*)?\d{1,2}%[^.,\n]{0,40}|\d{1,3}\s*יום\s*מ(?:קבלת|הגשת)\s*חשבונית/);if(pt)r.payTerms=pt[0].replace(/שוטף\s*\+?\s*/,'שוטף + ');
  const vd=flat.match(/(?:תוקף|בתוקף)[^.\n\d]{0,30}(\d{1,3})\s*(?:יום|ימים)/);if(vd)r.validity=+vd[1];
  const du=flat.match(/(?:משך (?:ה)?ביצוע|זמן ביצוע|לוח זמנים|נשלים|יבוצעו|תוך)[^.\n\d]{0,20}(\d{1,3})\s*(ימי עבודה|ימים|שבועות|חודשים)/);if(du)r.duration=du[1]+' '+du[2];
  const ex=lines.filter(l=>/^\s*[-•*\d.)]*\s*(?:לא כולל|ההצעה אינה כוללת|אינו כולל|החרגות|הסתייגות)/.test(l)&&!/מע"מ\s*$/.test(l.trim())).map(l=>l.trim().replace(/^[-•*\d.)\s]+/,''));

  return r;
}
/* "סריקת תיבת דואר" מדומה: פיצול טקסט מודבק לכמה מיילים */

/* כתב כמויות: זיהוי כותרות ועמודות (Excel או הדבקה מ-Excel) */
function parseCsv(s,sep){const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<s.length;i++){const ch=s[i];
    if(q){if(ch==='"'){if(s[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true;else if(ch===sep){row.push(cur);cur='';}else if(ch==='\n'){row.push(cur.replace(/\r$/,''));rows.push(row);row=[];cur='';}else cur+=ch;}
  if(cur||row.length){row.push(cur.replace(/\r$/,''));rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()));}
function rowsFromTSV(text){return String(text||'').replace(/\r/g,'').split('\n').filter(l=>l.trim()).map(l=>l.split('\t'));}
async function rowsFromFile(file){
  const n=file.name.toLowerCase();
  if(/\.(csv|txt|tsv)$/.test(n)){const s=(await readText(file)).replace(/^\ufeff/,'');const first=s.split('\n')[0];const sep=first.includes('\t')?'\t':(first.split(';').length>first.split(',').length?';':',');return parseCsv(s,sep);}
  await ensureLib('xlsx');const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
  let best=null;wb.SheetNames.forEach(sn=>{const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:'',raw:true});if(!best||rows.length>best.length)best=rows;});
  return best||[];
}
function detectCols(rows){
  let hi=-1,map={};
  for(let i=0;i<Math.min(rows.length,25);i++){
    const r=rows[i].map(c=>String(c||'').trim());
    const d=r.findIndex(c=>/^תיאור|תאור|תיאור העבודה|description/i.test(c));
    if(d>=0){hi=i;map.desc=d;
      r.forEach((c,j)=>{if(map.code==null&&/^(מס|סעיף|מספר|מק"ט|קוד|פרק)/.test(c)&&j!==d)map.code=j;
        if(map.unit==null&&/^יח/.test(c))map.unit=j;if(map.qty==null&&/^כמות|qty/i.test(c))map.qty=j;
        if(map.price==null&&/מחיר|price|rate/i.test(c))map.price=j;if(map.total==null&&/^סה"כ|^סה״כ|^סכום|total|amount/i.test(c)&&j>(map.price??-1))map.total=j;});
      break;}
  }
  if(hi<0){map={code:0,desc:1,unit:2,qty:3,price:4,total:5};}
  return {hi,map};
}
function parseBoqRows(rows){
  const {hi,map}=detectCols(rows);const items=[];let chap='';
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i];const g=k=>map[k]!=null?r[map[k]]:'';
    const desc=String(g('desc')||'').trim();const code=String(g('code')||'').trim();
    const qty=toNum(g('qty'));const price=toNum(g('price'));
    if(!desc&&!code)continue;
    if(/^סה"כ|^סה״כ|^סך הכל/.test(desc))continue;
    if((isNaN(qty)||qty===0)&&isNaN(price)){ if(desc||code){chap=(desc||code);items.push({id:uid('i'),chap:true,desc:chap,code});} continue;}
    items.push({id:uid('i'),code,desc,unit:String(g('unit')||'').trim(),qty:isNaN(qty)?null:qty,est:isNaN(price)?null:price,group:chap});
  }
  return {items,map,hi};
}
/* התאמת כתב כמויות מתומחר של ספק לסעיפי המכרז */
function matchPricedBoq(t,parsed){
  const norm=s=>String(s||'').replace(/[\s"'״׳.,\-–()]/g,'').slice(0,60);
  const base=t.items.filter(i=>!i.chap);const src=parsed.filter(i=>!i.chap&&isNum(i.est));
  const prices={};let matched=0;
  base.forEach((it,ix)=>{
    let m=src.find(s=>s.code&&it.code&&String(s.code)===String(it.code)&&norm(s.desc)===norm(it.desc))
      ||src.find(s=>norm(s.desc)&&norm(s.desc)===norm(it.desc))
      ||src.find(s=>s.code&&it.code&&String(s.code)===String(it.code));
    if(!m&&src.length===base.length)m=src[ix];
    if(m){prices[it.id]=+m.est;matched++;}
  });
  return {prices,matched,of:base.length};
}
/* ייבוא ספר ספקים מקובץ */
function parseVendorRows(rows){

      r.forEach((c,j)=>{if(map.name==null&&/^(שם הספק|שם החברה|ספק|חברה|שם|name|company)/i.test(c))map.name=j;else if(map.contact==null&&/איש קשר|contact/i.test(c))map.contact=j;
        else if(map.email==null&&/מייל|דוא"ל|דואל|email/i.test(c))map.email=j;else if(map.phone==null&&/טל|נייד|phone|mobile/i.test(c))map.phone=j;
        else if(map.cat==null&&/קטגור|תחום|מקצוע|category/i.test(c))map.cat=j;else if(map.cid==null&&/ח\.?פ|ע\.?מ|מספר עוסק/i.test(c))map.cid=j;});

/* ---------- ניתוח הצעות ויישור קו (חישוב סטטיסטי מבוסס כללים) ---------- */
function analyze(t){
  const st=S.settings,thr=(+st.outlierPct||25),lowThr=(+st.lowPct||20);
  const bids=t.bids;const est=tenderEstimate(t);
  const items=t.items.filter(i=>!i.chap);
  // סטטיסטיקה לכל סעיף
  const itemStats=items.map(it=>{
    const prices=bids.map(b=>{const v=b.prices?b.prices[it.id]:null;return isNum(v)?+v:null;});
    const valid=prices.filter(v=>v!=null);const med=median(valid);
    const flags=prices.map(v=>{
      if(v==null)return 'miss';
      if(valid.length>=2&&med){const d=(v-med)/med*100;if(d>thr)return 'hi';if(d<-thr)return 'lo';}
      else if(isNum(it.est)&&+it.est>0){const d=(v-it.est)/it.est*100;if(d>thr)return 'hi';if(d<-thr)return 'lo';}
      return '';});
    const minV=valid.length?Math.min(...valid):null;
    return {it,prices,med,flags,minV,n:valid.length};
  });
  // לכל הצעה
  const rows=bids.map((b,bi)=>{
    let boq=0,priced=0,missing=0,fill=0,hi=0,lo=0;
    itemStats.forEach(s=>{const v=s.prices[bi],q=+s.it.qty||0;
      if(v!=null){boq+=v*q;priced++;if(s.flags[bi]==='hi')hi++;if(s.flags[bi]==='lo')lo++;}
      else{missing++;const ref=s.med!=null?s.med:(isNum(s.it.est)?+s.it.est:null);if(ref!=null)fill+=ref*q;}});
    const net=netTotal(b);
    const base=net!=null?net:(priced?boq:null);
    const norm=base!=null?base+(priced?fill:0):null;
    return {b,v:V(b.vendorId),net,boq:priced?boq:null,priced,missing:priced?missing:0,fill:priced?fill:0,norm,hi,lo,
      vsEst:est&&net!=null?(net-est)/est*100:null,vsEstAbs:est&&net!=null?net-est:null};
  });
  const nets=rows.map(r=>r.net).filter(isNum);const medTot=median(nets);const minNet=nets.length?Math.min(...nets):null;
  const norms=rows.map(r=>r.norm).filter(isNum);const minNorm=norms.length?Math.min(...norms):null;
  rows.forEach(r=>{r.vsMed=medTot&&r.net!=null?(r.net-medTot)/medTot*100:null;r.vsMin=minNet&&r.net!=null?(r.net-minNet)/minNet*100:null;});
  const ranked=rows.filter(r=>isNum(r.norm)).slice().sort((a,b)=>a.norm-b.norm);ranked.forEach((r,i)=>r.rank=i+1);
  // תובנות
  const ins=[];const nm=r=>r.v?r.v.name:'ספק לא מזוהה';
  rows.forEach(r=>{
    const ref=nets.length>=3?r.vsMed:r.vsEst;const refL=nets.length>=3?'מחציון ההצעות':'מהאומדן';
    if(ref!=null&&ref<-lowThr)ins.push({s:'r',t:`${nm(r)}: ההצעה נמוכה ב-${Math.abs(ref).toFixed(1)}% ${refL}. מומלץ לוודא הבנת תכולה, כמויות והחרגות לפני בחירה (חשש לתמחור חסר).`});
    if(ref!=null&&ref>thr)ins.push({s:'y',t:`${nm(r)}: ההצעה גבוהה ב-${ref.toFixed(1)}% ${refL}.`});
    if(r.boq!=null&&r.net!=null&&Math.abs(r.boq-r.net)>Math.max(1,r.net*0.005))ins.push({s:'r',t:`${nm(r)}: פער של ${money(Math.abs(r.boq-r.net))} בין סכום הסעיפים המתומחרים (${money(r.boq)}) לסכום ההצעה (${money(r.net)}). ייתכן טעות חשבונית או סעיפים חסרים.`});
    if(r.missing)ins.push({s:'y',t:`${nm(r)}: ${r.missing} סעיפים לא תומחרו. ביישור הקו נוספו ${money(r.fill)} לפי חציון ההצעות האחרות או האומדן.`});
    if(r.hi||r.lo)ins.push({s:'',t:`${nm(r)}: ${r.hi} סעיפים חריגים כלפי מעלה ו-${r.lo} כלפי מטה (סטייה של יותר מ-${thr}% מהחציון).`});
    if(r.b.vatIncl)ins.push({s:'',t:`${nm(r)}: הסכום הוזן כולל מע"מ. בהשוואה הוא מוצג ללא מע"מ (${st.vat||18}%).`});
    if(r.b.rev&&r.b.rev!==t.curRev)ins.push({s:'y',t:`${nm(r)}: ההצעה מבוססת על ${r.b.rev}, והגרסה העדכנית היא ${t.curRev}. יש לבקש עדכון הצעה.`});
    if(r.b.validity&&r.b.receivedAt&&daysTo(addDays(r.b.receivedAt,+r.b.validity))<0)ins.push({s:'r',t:`${nm(r)}: תוקף ההצעה (${r.b.validity} יום) פג. יש לבקש הארכת תוקף.`});
    if(r.b.exclusions)ins.push({s:'',t:`${nm(r)}: החרגות – ${r.b.exclusions}`});
  });
  itemStats.forEach(s=>{if(s.n>=2&&s.minV&&s.prices.some(v=>v!=null&&v>s.minV*2))ins.push({s:'',t:`סעיף "${(s.it.code?s.it.code+' ':'')+s.it.desc}": פיזור מחירים גבוה (${money2(s.minV)} עד ${money2(Math.max(...s.prices.filter(v=>v!=null)))} ליחידה). כדאי לבדוק שכל המציעים הבינו את הסעיף באותו אופן.`});});
  if(ranked.length&&rows.length>1){const top=ranked[0];const lowestNet=rows.filter(r=>r.net!=null).sort((a,b)=>a.net-b.net)[0];
    if(lowestNet&&top.b.id!==lowestNet.b.id)ins.unshift({s:'y',t:`אחרי יישור קו ההצעה הזולה ביותר היא של ${nm(top)} (${money(top.norm)}), ולא ההצעה הנמוכה בסכום המוצהר (${nm(lowestNet)}, ${money(lowestNet.net)}).`});
    else ins.unshift({s:'g',t:`ההצעה הזולה ביותר אחרי יישור קו: ${nm(top)}, ${money(top.norm)}${est?` (${pctf((top.norm-est)/est*100)} מול האומדן)`:''}.`});}
  return {rows,itemStats,est,medTot,minNet,minNorm,ranked,ins,items};
}

async function ntAddFiles(files){
  const keep=$('#tf_name')?readTenderForm():{};
  for(const f of files){const meta=await storeFile(f,{rev:'Rev 0',rfq:true,kind:'doc'});NT.files.push(meta);
    if(/\.pdf$/i.test(f.name)){
      try{toast('מחלץ טקסט מ-'+f.name+'…',6000);const r=await pdfText(f);const a=autoSummary(r.text,f.name,r.pages);
        keep.summary=(keep.summary?keep.summary+'\n\n':'')+a.summary;NT.auto.summary=1;NT.src=a.source;NT.disc=a.disciplines;
        if(a.found.duration&&!keep.duration){keep.duration=a.found.duration;NT.auto.duration=1;}
        if(a.found.deadline&&!keep.deadline){const m=a.found.deadline.split(/[./]/);if(m.length===3){const y=m[2].length===2?'20'+m[2]:m[2];keep.deadline=`${y}-${m[1].padStart(2,'0')}-${m[0].padStart(2,'0')}`;NT.auto.deadline=1;}}
        if(!keep.name&&a.disciplines[0]){keep.name='עבודות '+a.disciplines[0];NT.auto.name=1;}
        const p=curP();if(p&&a.found.area&&!p.area)p.area=a.found.area;if(p&&a.found.address&&!p.address)p.address=a.found.address;
      }catch(e){toast('לא ניתן לחלץ טקסט: '+e.message,5000);}
    }
  }
  renderNewTender(keep);
}
function ntSave(){
  const d=readTenderForm();if(!d.name)return toast('יש להזין שם למכרז');if(!d.category)return toast('יש לבחור קטגוריה');
  const p=curP();const t=newTender(p,d);t.files=NT.files.slice();
  syncCategory(t);
  if(NT.files.length)hist(t,'file',`צורפו ${NT.files.length} קבצים (Rev 0)`);
  if(NT.auto.summary)hist(t,'note','תקציר הפרויקט חולץ אוטומטית ממסמך PDF');
  UI.tid=t.id;UI.view='tender';UI.ttab='over';NT=null;save();closeModal();render();toast('המכרז נוצר');
}
function dupTender(tid){
  const p=curP();const t=p.tenders.find(x=>x.id===tid);if(!t)return;
  const c=JSON.parse(JSON.stringify(t));
  Object.assign(c,{id:uid('t'),name:t.name+' (עותק)',status:'draft',history:[],approvals:[],invitees:t.invitees.map(i=>({vendorId:i.vendorId,addedAt:Date.now()})),bids:[],award:null,contract:'',created:Date.now()});
  c.items.forEach(i=>{const old=i.id;i.id=uid('i');});
  p.tenders.push(c);hist(c,'create',`נוצר כעותק של "${t.name}"`);save();render();toast('המכרז שוכפל (ללא הצעות והיסטוריה)');
}

    const why=!ok?(t.status==='pend_dist'?'ממתין לאישור הפצה':t.status==='draft'?'טיוטה – נדרש אישור הפצה':TSTAT[t.status].l):!t.invitees.length?'לא נבחרו ספקים':!unsent.length?'כל הפניות נשלחו':'';

     ${rows?`<div class="tbl-scroll"><table class="t"><thead><tr><th>מכרז</th><th>קטגוריה</th><th>סטטוס</th><th>טרם נשלחו</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">אין מכרזים פתוחים</div>'}`,

}
function batchGo(){
  const p=curP();const ids=$$('.brq:checked').map(x=>x.value);if(!ids.length)return toast('לא נבחרו מכרזים');
  let items=[];ids.forEach(id=>{const t=p.tenders.find(x=>x.id===id);if(t.status==='draft')approveDirect(t);items=items.concat(rfqItems(p,t,autoTargets(t)));});

function viewTender(){

      <div class="row"><button class="btn" data-act="report">📑 דו"ח סיכום מכרז</button>${ACTIVE_ST.includes(t.status)?'<button class="btn ghost danger" data-act="t-cancel">ביטול מכרז</button>':''}<button class="btn ghost" data-act="t-del">🗑️</button></div></div>

/* ---- שער אישורים ---- */
function autoSendRfq(t){const list=autoTargets(t);if(!list.length)return;toast(`המכרז אושר להפצה. הוכנו פניות ל-${list.length} קבלנים בקטגוריה – לחצו "שלח" בכל טיוטה`,5000);sendRfq(t,list);}
function approveDirect(t){if(t.status==='draft'){t.approvals.push({id:uid('a'),stage:'dist',requestedAt:Date.now(),decidedAt:Date.now(),decision:'approved',approver:S.settings.pmName||'מנהל הפרויקט',note:'אושר ללא שלב אישור נפרד'});setStatus(t,'dist','אושר להפצה');}}
function pendingApproval(t,stage){return t.approvals.slice().reverse().find(a=>a.stage===stage&&!a.decision);}
function gatePanel(p,t){
  const ap=S.settings.approver||'';
  const apForm=(stage)=>`<div class="fields"><div><label class="f">שם המאשר</label><input class="i" id="g_appr" value="${esc(ap)}" placeholder="מנהל המחלקה / נציג היזם"></div><div style="grid-column:span 2"><label class="f">הערה</label><input class="i" id="g_note" placeholder="אופציונלי"></div></div>`;
  switch(t.status){
    case 'draft':{const miss=[];if(!t.invitees.length)miss.push('לא נבחרו ספקים');if(!t.deadline)miss.push('לא נקבע מועד הגשה');if(!t.files.some(f=>f.rfq))miss.push('לא סומנו קבצים לצירוף לפנייה');if(!isNum(tenderEstimate(t)))miss.push('לא הוגדר אומדן');
      return `<div class="gate"><h4>📝 טיוטה – הכנה להפצה</h4>${miss.length?`<div class="mini">לפני ההפצה מומלץ להשלים: ${miss.join(' · ')}</div>`:'<div class="mini pos">המכרז מוכן להפצה.</div>'}
        ${S.settings.requireDist?`${apForm()}<div class="row"><button class="btn pri" data-act="g-req" data-stage="dist">שליחה לאישור הפצה</button></div>`:`<div class="row"><button class="btn pri" data-act="g-direct">אישור והעברה להפצה</button></div>`}</div>`;}
    case 'pend_dist':{const a=pendingApproval(t,'dist')||{};
      return `<div class="gate"><h4>⏳ ממתין לאישור הפצה</h4><div class="mini">הוגש לאישור ${a.approver?'של <b>'+esc(a.approver)+'</b> ':''}ב-${fdt(a.requestedAt)}${a.note?' · '+esc(a.note):''}</div>
        <div class="mini">אפשר לשלוח למאשר את דו"ח הסיכום להצגה ולתעד כאן את ההחלטה.</div>${apForm()}
        <div class="row"><button class="btn ok" data-act="g-dec" data-stage="dist" data-d="approved">✓ אושר להפצה</button><button class="btn danger" data-act="g-dec" data-stage="dist" data-d="rejected">✕ הוחזר לתיקון</button><button class="btn sm ghost" data-act="report">📑 דו"ח למאשר</button></div></div>`;}
    case 'dist':{const uns=t.invitees.filter(i=>!i.rfqAt).length;const au=autoTargets(t).length;
      return `<div class="gate blue"><h4>📤 בהפצה</h4><div class="mini">${t.invitees.length} ספקים נבחרו · ${t.invitees.length-uns} פניות נשלחו${uns?` · <b>${uns} טרם נשלחו</b>`:''}</div>
        <div class="row">${au?`<button class="btn pri" data-act="rfq-all">✉️ שליחת פניות ל-${au} קבלנים</button>`:''}<button class="btn ${au?'':'pri'}" data-act="ttab" data-tab="rfq">ספקים, פניות ותזכורות</button><button class="btn" data-act="g-collect">מעבר לאיסוף הצעות</button></div></div>`;}
    case 'collect':{const pend=pendingReplies(t).length;
      return `<div class="gate blue"><h4>📥 נאספות הצעות</h4><div class="mini">${t.bids.length} הצעות התקבלו · ${pend} ספקים טרם הגישו · מועד הגשה ${t.deadline?fdate(t.deadline)+' '+dlChip(t.deadline):'לא נקבע'}</div>
        <div class="row"><button class="btn" data-act="ttab" data-tab="bids">➕ קליטת הצעה</button><button class="btn pri" data-act="ttab" data-tab="cmp">📊 השוואה ובחירת זוכה</button></div></div>`;}
    case 'pend_award':{const a=pendingApproval(t,'award')||{};const b=t.bids.find(x=>x.id===(t.award||{}).bidId);const v=b&&V(b.vendorId);
      return `<div class="gate"><h4>⏳ ממתין לאישור הנהלה על בחירת זוכה</h4><div class="mini">המלצה: <b>${esc(v?v.name:'—')}</b> בסך <b>${money(b?netTotal(b):null)}</b>. ${t.award&&t.award.reason?'נימוק: '+esc(t.award.reason):''}</div>
        <div class="mini">הוגש לאישור ${a.approver?'של <b>'+esc(a.approver)+'</b> ':''}ב-${fdt(a.requestedAt)}</div>${apForm()}
        <div class="row"><button class="btn ok" data-act="g-dec" data-stage="award" data-d="approved">✓ אושר – סגירת המכרז</button><button class="btn danger" data-act="g-dec" data-stage="award" data-d="rejected">✕ לא אושר</button><button class="btn sm ghost" data-act="report">📑 דו"ח לוועדה</button></div></div>`;}
    case 'closed':{const b=t.bids.find(x=>x.id===(t.award||{}).bidId);const v=b&&V(b.vendorId);
      return `<div class="gate ok"><h4>🏆 נבחר זוכה: ${esc(v?v.name:'—')} · ${money(b?netTotal(b):null)}</h4><div class="mini">${t.award&&t.award.approvedBy?'אושר על ידי '+esc(t.award.approvedBy)+' ב-'+fdt(t.award.approvedAt):''}</div>
        <div class="row"><button class="btn pri" data-act="ttab" data-tab="award">הודעות וחוזה</button><button class="btn ghost" data-act="g-reopen">פתיחה מחדש</button></div></div>`;}
  }
  return '';
}
function gateRequest(t,stage){
  const appr=($('#g_appr')||{}).value||'';const note=($('#g_note')||{}).value||'';
  if(appr)S.settings.approver=appr;
  t.approvals.push({id:uid('a'),stage,requestedAt:Date.now(),approver:appr,note,decision:null});
  hist(t,'approval',`הוגש ל${stage==='dist'?'אישור הפצה':'אישור הנהלה'}${appr?' – '+appr:''}${note?' · '+note:''}`);
  setStatus(t,stage==='dist'?'pend_dist':'pend_award');
}
function gateDecide(t,stage,d){
  const appr=($('#g_appr')||{}).value||'';const note=($('#g_note')||{}).value||'';
  if(d==='rejected'&&!note)return toast('יש לרשום בהערה את סיבת ההחזרה');
  let a=pendingApproval(t,stage);if(!a){a={id:uid('a'),stage,requestedAt:Date.now()};t.approvals.push(a);}
  Object.assign(a,{decision:d,decidedAt:Date.now(),approver:appr||a.approver||'',decNote:note});
  hist(t,d==='approved'?'approval':'reject',`${stage==='dist'?'הפצה':'בחירת זוכה'}: ${d==='approved'?'אושר':'לא אושר'}${appr?' על ידי '+appr:''}${note?' · '+note:''}`);
  if(stage==='dist'){setStatus(t,d==='approved'?'dist':'draft');if(d==='approved'){save();render();autoSendRfq(t);return;}}
  else if(d==='approved'){t.award.approvedBy=appr||a.approver||'';t.award.approvedAt=Date.now();setStatus(t,'closed');}
  else{hist(t,'reject','בחירת הזוכה בוטלה');t.award=null;setStatus(t,'collect');}
  save();render();
  if(stage==='award'&&d==='approved'){UI.ttab='award';render();toast('המכרז נסגר. אפשר לשלוח הודעות זכייה ואי-זכייה');}
}

function saveTenderForm(t){
  const d=readTenderForm();if(!d.name)return toast('שם המכרז חסר');
  const ch=[];['deadline','estimate','category','payTerms'].forEach(k=>{if(String(t[k]??'')!==String(d[k]??''))ch.push(k);});
  if(t.deadline&&d.deadline!==t.deadline)hist(t,'deadline',`מועד ההגשה עודכן: ${fdate(t.deadline)} ← ${fdate(d.deadline)}`);
  if(String(t.estimate??'')!==String(d.estimate??''))hist(t,'note',`האומדן עודכן ל-${money(d.estimate)}`);

async function tenderSummary(t){
  const pdfs=t.files.filter(f=>/\.pdf$/i.test(f.name));let all='',pages=0;
  try{for(const f of pdfs){toast('מנתח '+f.name+'…',6000);const b=await getBlob(f.id);if(!b)continue;const r=await pdfText(b);all+=r.text+'\n';pages+=r.pages;}}catch(e){return toast(e.message,5000);}
  const a=autoSummary(all,pdfs.map(f=>f.name).join(', '),pages);
  const cur=($('#tf_summary')||{}).value||t.summary||'';
  openModal({title:'✨ תקציר אוטומטי',wide:true,body:`<div class="info" style="margin-bottom:10px">נבנה מכללי זיהוי טקסט במסמך (לא מודל בינה מלאכותית). מקור: ${esc(a.source)}.</div>
    <label class="f">התקציר המוצע (ניתן לעריכה)</label><textarea class="i auto" id="sumNew" style="min-height:200px">${esc(a.summary)}</textarea>
    ${cur?`<label class="f" style="margin-top:10px">התקציר הקיים</label><div class="mini" style="white-space:pre-wrap;border:1px solid var(--line);border-radius:9px;padding:9px">${esc(cur)}</div>`:''}`,

/* פענוח בסיסי של קובץ ‎.eml */
function qpDecode(s){const bytes=[];s=s.replace(/=\r?\n/g,'');for(let i=0;i<s.length;i++){if(s[i]==='='&&/^[0-9A-F]{2}$/i.test(s.substr(i+1,2))){bytes.push(parseInt(s.substr(i+1,2),16));i+=2;}else bytes.push(s.charCodeAt(i)&255);}return new TextDecoder('utf-8').decode(new Uint8Array(bytes));}
function b64Decode(s){try{const bin=atob(s.replace(/\s+/g,''));return new TextDecoder('utf-8').decode(Uint8Array.from(bin,c=>c.charCodeAt(0)));}catch(e){return '';}}
function decodeWords(s){return String(s||'').replace(/=\?([\w-]+)\?([BQ])\?([^?]*)\?=/gi,(m,cs,enc,txt)=>enc.toUpperCase()==='B'?b64Decode(txt):qpDecode(txt.replace(/_/g,' ')));}
function emlToText(raw){
  const head=raw.split(/\r?\n\r?\n/)[0]||'';const hdr=k=>{const m=head.match(new RegExp('^'+k+':\\s*(.+(?:\\r?\\n[ \\t].+)*)','mi'));return m?decodeWords(m[1].replace(/\r?\n[ \t]/g,' ')):'';};
  let body='';const re=/Content-Type:\s*text\/(plain|html)[^\n]*(?:\r?\n[^\r\n]+)*?\r?\n(?:[^\r\n]+\r?\n)*?\r?\n([\s\S]*?)(?=\r?\n--|$)/gi;let m;
  const blocks=raw.split(/\r?\n--[^\r\n]+/);
  blocks.forEach(bk=>{const hm=bk.match(/^([\s\S]*?)\r?\n\r?\n([\s\S]*)$/);if(!hm)return;const h=hm[1],b=hm[2];
    if(!/content-type:\s*text\/(plain|html)/i.test(h)&&/content-type:/i.test(h))return;
    let txt=/base64/i.test(h)?b64Decode(b):/quoted-printable/i.test(h)?qpDecode(b):b;
    if(/text\/html/i.test(h))txt=txt.replace(/<br\s*\/?>/gi,'\n').replace(/<\/p>/gi,'\n').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ');
    if(!body||/text\/plain/i.test(h))body=body&&/text\/plain/i.test(h)?txt:(body||txt);});
  return `From: ${hdr('From')}\nSubject: ${hdr('Subject')}\nDate: ${hdr('Date')}\n\n${body||raw}`;
}

  $$('.sck:checked').forEach(ch=>{const c=SC.cands[+ch.dataset.i];const r=c.r;if(!r.vendorId||!isNum(r.total))return;
    const v=V(r.vendorId);let b=bidOf(t,r.vendorId);const data={vendorId:r.vendorId,total:r.total,vatIncl:!!r.vatIncl,payTerms:r.payTerms||'',validity:r.validity||null,duration:r.duration||'',exclusions:r.exclusions||'',receivedAt:r.receivedAt||today(),rev:t.curRev,notes:c.gmailId?'נקלט מ-Gmail':'נקלט מסריקת מייל',source:'email'};
    if(b){b.versions=b.versions||[];b.versions.push({ts:Date.now(),total:b.total,rev:b.rev});Object.assign(b,data);}else{b={id:uid('b'),...data,prices:{},files:[],created:Date.now()};t.bids.push(b);}

const CAT_KW={
  'קבלן ראשי / גמר':['קבלן ראשי','גמר','שיפוצ','קבלן בניה','קבלן בנייה','בינוי'],
  'קבלן הריסות':['הריס','פירוק','חציב','ניסור','קידוח'],
  'קבלן גבס ותקרות':['גבס','תקרה','תקרות','מחיצ','בניה יבשה','בנייה יבשה','עבודות יבשות'],
  'קבלן אינסטלציה':['אינסטלצ','אינסטלטור','ביוב','צנרת','סניטרי','שרברב'],
  'קבלן מיזוג אוויר':['מיזוג','מזגנ','קירור','vrf','אוורור','מיזוג אויר'],
  'קבלן חשמל':['חשמל'],
  'מערכות מתח נמוך ותקשורת':['מתח נמוך','תקשורת','מצלמ','אבטחה','מולטימדיה','אינטרקום','בקרת כניסה','רשתות','סייבר','כריזה'],
  'קבלן כיבוי אש וספרינקלרים':['כיבוי אש','כיבוי','ספרינקלר','גילוי אש','מתזים','גלאי עשן'],
  'קבלן איטום':['איטום','בידוד','זפת'],
  'ריצוף וחיפוי':['ריצוף','רצף','חיפוי','אריח','פרקט','שיש','קרמיקה','טרצו','שטיח','אבן'],
  'נגרות':['נגרות','נגר','ארונות','מטבח','עץ'],
  'אלומיניום וזכוכית':['אלומיני','זכוכית','זגג','תריס','חלונות','ויטרינ','פרגול'],
  'מסגרות':['מסגר','פלדה','ברזל','מעקות','נירוסט'],
  'צבע':['צבע','טיח','שפכטל'],
  'ספק ריהוט':['ריהוט','רהיט','כסאות','כיסאות'],
  'ספק תאורה':['תאורה','גופי תאורה','תאור'],
  'שילוט':['שילוט','שלטים','שלט'],
  'יועץ בטיחות':['בטיחות','ממונה בטיחות'],
  'יועץ אקוסטיקה':['אקוסטי'],
  'יועץ נגישות':['נגישות'],
  'ניקיון ופינוי':['ניקיון','נקיון','פינוי','פסולת','מכולות']
};
const CAT_STOP=['מערכות','עבודות','קבלן','ספק','יועץ','כללי','שונות'];
/* מילה קצרה נבדקת כמילה שלמה (עם תחילית ו/ב/ה/ל/מ/ש), ארוכה – כחלק ממילה */
function kwHit(src,k){if(k.length>3)return src.includes(k);return new RegExp('(^|[^א-תa-z])[ובהלמש]?'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^א-תa-z])').test(src);}
/* זיהוי קטגוריות מטקסט (שם הספק + עמודת התחום). מחזיר את הקטגוריות הקיימות שזוהו ורמת ודאות */
function guessCats(name,catText){
  const src=(String(catText||'')+' '+String(name||'')).toLowerCase();const ct=String(catText||'').trim();
  // התאמה מדויקת לשם קטגוריה קיימת
  const exact=ct?ct.split(/[;\/|]|,(?=\s*[א-ת])/).map(s=>s.trim()).filter(Boolean).map(s=>S.categories.find(c=>c===s)).filter(Boolean):[];
  if(exact.length&&S.categories.includes(ct)) return {cats:[ct],level:'sure'};
  const hits=[];
  S.categories.forEach(c=>{
    const kws=(CAT_KW[c]||[]).concat(c.replace(/^(קבלן|ספק|יועץ)\s+/,'').split(/\s+ו?|\s*\/\s*/).filter(w=>w.length>=3&&!CAT_STOP.includes(w)));
    const sc=[...new Set(kws)].filter(k=>kwHit(src,k.toLowerCase())).length;if(sc)hits.push([c,sc]);});
  hits.sort((a,b)=>b[1]-a[1]);
  if(!hits.length) return {cats:[],level:'none',suggest:ct};
  const cats=[...new Set(exact.concat(hits.slice(0,3).map(h=>h[0])))];
  // ודאות: התחום כתוב במפורש ונמצאה התאמה אחת עיקרית
  const level=ct&&hits.length===1?'sure':'maybe';
  return {cats,level,suggest:hits.length?'':ct};
}

const IMP_FIELDS=[['','— התעלמות —'],['name','שם הספק / החברה'],['contact','איש קשר'],['email','דוא"ל'],['phone','טלפון'],['cat','תחום / קטגוריה'],['companyId','ח.פ. / ע.מ.'],['address','כתובת'],['notes','הערות']];
let IMP=null;
const isEmail=s=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(s||'').trim());
const isPhone=s=>{const x=String(s||'').trim();return /^[\d\-\s+()]{7,}$/.test(x)&&x.replace(/\D/g,'').length>=7;};
const isIndex=s=>/^\d{1,5}$/.test(String(s||'').trim());
const isCompId=s=>/^\d{2}-?\d{6,7}-?\d?$/.test(String(s||'').trim())||/^5\d{8}$/.test(String(s||'').trim());
function guessHeaderRow(rows){
  for(let i=0;i<Math.min(rows.length,8);i++){const r=rows[i].map(c=>String(c||'').trim());
    const ne=r.filter(Boolean);const hd=ne.filter(c=>c.length<=25&&/^(מס|#|שם|ספק|קבלן|חברה|איש קשר|מייל|דוא"ל|דוא״ל|דואל|טל|נייד|פלאפון|תחום|קטגור|מקצוע|סיווג|כתובת|הערות|תפקיד|ח\.?פ|ע\.?מ|name|email|e-mail|phone|company|contact|category)/i.test(c));
    if(hd.length>=2&&hd.length>=ne.length/2&&!r.some(isEmail))return i;}
  return -1;
}
function guessMapping(rows,hi){
  const data=rows.slice(hi+1).filter(r=>r.some(c=>String(c||'').trim())).slice(0,60);
  const ncol=Math.max(0,...rows.slice(0,Math.max(hi+1,1)).concat(data).map(r=>r.length));
  const hdr=hi>=0?rows[hi].map(c=>String(c||'').trim()):[];
  const map=new Array(ncol).fill('');const used=new Set();
  const set=(j,f)=>{if(!used.has(f)&&!map[j]){map[j]=f;used.add(f);}};
  // לפי כותרות
  hdr.forEach((c,j)=>{
    if(/מייל|דוא"ל|דואל|דוא״ל|e-?mail/i.test(c))set(j,'email');
    else if(/טל|נייד|פלאפון|phone|mobile/i.test(c))set(j,'phone');
    else if(/איש קשר|שם איש|contact/i.test(c))set(j,'contact');
    else if(/תחום|קטגור|מקצוע|סיווג|התמחות|category/i.test(c))set(j,'cat');
    else if(/ח\.?פ|ע\.?מ|מספר עוסק|ת\.?ז/i.test(c))set(j,'companyId');
    else if(/כתובת|address/i.test(c))set(j,'address');
    else if(/הערות|notes/i.test(c))set(j,'notes');
    else if(/שם (הספק|החברה|הקבלן)|^ספק|^קבלן|^חברה|^שם$|name|company/i.test(c))set(j,'name');
  });
  // לפי תוכן העמודה
  const share=(j,fn)=>{const v=data.map(r=>r[j]).filter(x=>String(x??'').trim());return v.length?v.filter(fn).length/v.length:0;};
  const catScore=j=>{const v=data.map(r=>r[j]).filter(x=>String(x??'').trim());return v.length?v.filter(x=>guessCats('',x).cats.length).length/v.length:0;};
  for(let j=0;j<ncol;j++){if(map[j])continue;
    if(share(j,isEmail)>0.5)set(j,'email');else if(share(j,isIndex)>0.8)map[j]='';else if(share(j,isCompId)>0.6)set(j,'companyId');else if(share(j,isPhone)>0.6)set(j,'phone');}
  const text=[];for(let j=0;j<ncol;j++)if(!map[j]&&share(j,x=>/[א-תa-z]/i.test(String(x)))>0.6)text.push(j);
  if(!used.has('cat')){let best=-1,bs=0.3;text.forEach(j=>{const s=catScore(j);if(s>bs){bs=s;best=j;}});if(best>=0)set(best,'cat');}
  text.filter(j=>!map[j]).forEach(j=>{if(!used.has('name'))set(j,'name');else if(!used.has('contact'))set(j,'contact');});
  return map;
}
async function importVendors(files){
  const f=files[0];if(!f)return;let rows;try{rows=await rowsFromFile(f);}catch(e){return toast(e.message,5000);}

}

function impBuildRecs(){
  const {rows,hi,map}=IMP;const col=f=>map.indexOf(f);

function impGo(){
  const R=IMP.recs.filter(r=>r.on);if(!R.length)return toast('לא נבחרו ספקים');
  let del=0;if(IMP.wipe){const before=S.vendors.length;S.vendors=S.vendors.filter(v=>vendorStats(v.id).inv);del=before-S.vendors.length;}
  let add=0,upd=0,newC=0;
  R.forEach(r=>{const cats=r.cats.slice();if(r.newCat){if(!S.categories.includes(r.newCat)){S.categories.push(r.newCat);newC++;}cats.push(r.newCat);}
    const d={name:r.name,contact:r.contact,email:r.email,phone:r.phone,companyId:r.companyId,address:r.address,notes:r.notes};
    const ex=S.vendors.find(v=>(d.email&&v.email&&v.email.toLowerCase()===d.email.toLowerCase())||v.name===d.name);
    if(ex){Object.keys(d).forEach(k=>{if(d[k])ex[k]=d[k];});ex.cats=[...new Set([...(ex.cats||[]),...cats])];upd++;}
    else{S.vendors.push({id:uid('v'),created:Date.now(),...d,cats});add++;}});
  const n=syncAll();IMP=null;save();closeModal();render();
  toast([del&&`נמחקו ${del}`,`נוספו ${add} ספקים`,upd&&`עודכנו ${upd}`,newC&&`${newC} קטגוריות חדשות`,n&&`${n} שיוכים חדשים למכרזים פתוחים`].filter(Boolean).join(' · '),5000);
}

async function restore(files){
  const f=files[0];if(!f)return;
  try{let data,nf=0;
    if(/\.zip$/i.test(f.name)){await ensureLib('zip');const z=await JSZip.loadAsync(f);data=JSON.parse(await z.file('data.json').async('string'));
      const meta=JSON.parse(await (z.file('files.json')?z.file('files.json').async('string'):'[]'));
      for(const m of meta){const e=z.file('files/'+m.id);if(e){await FDB.put({...m,blob:new Blob([await e.async('arraybuffer')],{type:m.type})});nf++;}}}
    else data=JSON.parse(await readText(f));
    if(!data||!Array.isArray(data.projects))throw new Error('קובץ הגיבוי אינו תקין');
    if(!confirm(`לשחזר ${data.projects.length} פרויקטים ו-${(data.vendors||[]).length} ספקים? הנתונים הנוכחיים יוחלפו.`))return;
    localStorage.setItem(KEY,JSON.stringify(data));loadState();UI.view='dash';render();toast(`השחזור הושלם${nf?` · ${nf} קבצים`:''}`);
  }catch(e){toast('שחזור נכשל: '+e.message,5000);}
}

async function handleFiles(scope,owner,files){
  if(!files||!files.length)return;
  try{
    if(scope==='p'){const p=P(owner);for(const f of files)p.files.push(await storeFile(f,{kind:'doc'}));save();render();toast(`${files.length} קבצים נוספו לפרויקט`);}
    else if(scope==='t'){const t=findTender(owner)[1];for(const f of files)t.files.push(await storeFile(f,{rev:t.curRev,rfq:true,kind:'doc'}));hist(t,'file',`צורפו ${files.length} קבצים (${t.curRev}): ${files.map(f=>f.name).join(', ')}`);save();render();toast('הקבצים נוספו');}
    else if(scope==='nt')await ntAddFiles(files);
    else if(scope==='nr')await nrAddFiles(files);
    else if(scope==='bm')await bmAddFiles(files);
    else if(scope==='scan')await scanFiles(files);
  }catch(e){console.error(e);toast('שגיאה בשמירת הקובץ: '+e.message,5000);}
}

function bind(){
  document.addEventListener('click',e=>{
    const dz=e.target.closest('.dz');
    if(dz&&!e.target.closest('[data-act]')){pickFiles({}).then(f=>handleFiles(dz.dataset.drop,dz.dataset.owner,f));return;}
    const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
    if(el.tagName==='A'&&!el.getAttribute('href')?.startsWith('blob:'))e.preventDefault();
    const f=ACT[el.dataset.act];if(f){try{const r=f(el,e);if(r&&r.catch)r.catch(err=>{console.error(err);toast('שגיאה: '+err.message,5000);});}catch(err){console.error(err);toast('שגיאה: '+err.message,5000);}}
  });
  document.addEventListener('change',e=>{
    const el=e.target;const ch=el.dataset.ch;
    if(ch==='file-flag'){const list=el.dataset.scope==='p'?P(el.dataset.owner).files:findTender(el.dataset.owner)[1].files;const f=list.find(x=>x.id===el.dataset.fid);if(f){if(el.dataset.scope==='p')f.shareAll=el.checked;else f.rfq=el.checked;save();}}
    else if(ch==='boq')boqChange(el);
    else if(ch==='cat-select'&&el.value==='__new'){const v=(prompt('שם הקטגוריה החדשה:')||'').trim();if(v){if(!S.categories.includes(v))S.categories.push(v);save();el.innerHTML='<option value="">בחרו…</option>'+catOptions(v);}else el.value='';}
    else if(el.dataset.set){const k=el.dataset.set;S.settings[k]=el.type==='checkbox'?el.checked:el.type==='number'?(+el.value||0):el.value;save();if(el.type==='checkbox')render();}
    else if(el.id==='vCat'){UI.vcat=el.value;render();}
    else if(el.id==='projSel'){if(el.value)go('project',{pid:el.value});else go('dash');}
  });
  let tplT=null;
  document.addEventListener('input',e=>{
    const el=e.target;
    if(el.dataset.ob!=null){const it=OB&&OB.items[+el.dataset.i];if(it)it[el.dataset.ob]=el.value;}
    else if(el.dataset.tpl){S.settings.tpl[el.dataset.tpl]=el.value;clearTimeout(tplT);tplT=setTimeout(save,400);}
    else if(el.id==='vSearch'){UI.vfilter=el.value;const pos=el.selectionStart;render();const n=$('#vSearch');n.focus();n.setSelectionRange(pos,pos);}
  });
  document.addEventListener('dragover',e=>{const dz=e.target.closest&&e.target.closest('.dz');if(dz){e.preventDefault();dz.classList.add('over');}});
  document.addEventListener('dragleave',e=>{const dz=e.target.closest&&e.target.closest('.dz');if(dz)dz.classList.remove('over');});
  document.addEventListener('drop',e=>{const dz=e.target.closest&&e.target.closest('.dz');if(!dz)return;e.preventDefault();dz.classList.remove('over');handleFiles(dz.dataset.drop,dz.dataset.owner,Array.from(e.dataTransfer.files||[]));});
  window.addEventListener('dragover',e=>e.preventDefault());window.addEventListener('drop',e=>{if(!(e.target.closest&&e.target.closest('.dz')))e.preventDefault();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#ov').classList.contains('on'))closeModal();});
  $('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b||b.disabled)return;go(b.dataset.v);});
  window.addEventListener('storage',e=>{if(e.key===KEY){loadState();render();}});
}

/* =================== Google Drive + Gmail ===================
   התחברות OAuth בדפדפן (Google Identity Services). אותו Client ID כמו מערכת התזרים.
   Drive (drive.file): האפליקציה רואה רק קבצים שהיא יצרה.
     <תיקייה ראשית>/tenders-db.json , <תיקייה ראשית>/<פרויקט>/<מכרז>/<קבצים>
   Gmail (gmail.send + gmail.readonly): שליחה ישירה מהחשבון, וקריאת תשובות של ספקים לקליטת הצעות. */
const GG_K='tenders_google',GG_DATA='tenders-db.json';
const SC_DRIVE='https://www.googleapis.com/auth/drive.file',SC_GSEND='https://www.googleapis.com/auth/gmail.send',SC_GREAD='https://www.googleapis.com/auth/gmail.readonly';

function ggLoad(){
  let o={};try{o=JSON.parse(localStorage.getItem(GG_K)||'{}')||{};}catch(e){}
  // ברירת מחדל: ה-Client ID של מערכת התזרים, אם היא פועלת מאותו אתר
  let cid='';try{cid=(JSON.parse(localStorage.getItem('fitout-cashflow-drive')||'{}')||{}).clientId||'';}catch(e){}
  return Object.assign({clientId:cid,rootName:'ניהול מכרזים',drive:true,gmail:true,enabled:false,rootId:'',fileId:'',remoteMod:'',syncedAt:0,folders:{},trash:[],lastOk:0,lastErr:'',email:''},o);
}
function ggSave(){try{localStorage.setItem(GG_K,JSON.stringify(GG));}catch(e){}}
const ggLive=()=>!!ggToken&&Date.now()<ggExp;
const ggDriveOn=()=>GG.enabled&&GG.drive;
const gmailReady=()=>GG.enabled&&GG.gmail&&ggLive()&&ggScopes.includes(SC_GSEND);
const gmailReadReady=()=>GG.enabled&&GG.gmail&&ggLive()&&ggScopes.includes(SC_GREAD);
function ggState(){
  if(!GG.enabled)return ['off','לא מחובר לחשבון Google'];
  if(!ggLive())return ['wait','נדרשת התחברות מחדש ל-Google – לחצו כדי לחדש'];
  if(GG.lastErr)return ['err','שגיאה: '+GG.lastErr];
  if(ggBusy||ggFilesBusy||ggTimer)return ['wait','מסנכרן…'];
  return ['ok',[GG.drive&&'מסונכרן ל-Drive',GG.gmail&&'Gmail מחובר'].filter(Boolean).join(' · ')+(GG.lastOk&&GG.drive?' · '+new Date(GG.lastOk).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}):'')+(GG.email?' · '+GG.email:'')];
}
function ggUI(){

async function ggFetch(url,opt={}){

}
function ggScopeList(){return [GG.drive&&SC_DRIVE,GG.gmail&&SC_GSEND,GG.gmail&&SC_GREAD].filter(Boolean).join(' ');}
async function ggConnect(){
  const cid=($('#ggCid')&&$('#ggCid').value.trim())||GG.clientId;GG.clientId=cid;
  if($('#ggRoot'))GG.rootName=$('#ggRoot').value.trim()||GG.rootName;

  const want=ggScopeList();

    if(!(window.google&&google.accounts&&google.accounts.oauth2))await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=res;s.onerror=()=>rej(new Error('לא ניתן לטעון את רכיב ההתחברות של Google'));document.head.appendChild(s);});
    await new Promise((res,rej)=>{
      const tc=google.accounts.oauth2.initTokenClient({client_id:GG.clientId,scope:want,include_granted_scopes:true,
        callback:r=>{if(r.error)return rej(new Error(r.error_description||r.error));ggToken=r.access_token;ggExp=Date.now()+((+r.expires_in||3600)-60)*1000;ggScopes=r.scope||want;res();},
        error_callback:e=>rej(new Error(e&&e.type==='popup_closed'?'חלון ההתחברות נסגר':(e&&e.message)||'ההתחברות נכשלה'))});

    });
  }catch(e){toast('התחברות ל-Google נכשלה: '+e.message,6000);ggUI();return;}
  const miss=want.split(' ').filter(s=>!ggScopes.includes(s));
  GG.enabled=true;GG.lastErr='';ggSave();
  if(GG.gmail&&ggScopes.includes(SC_GSEND)){try{GG.email=(await (await ggFetch(GMAIL+'profile')).json()).emailAddress||'';}catch(e){}}
  ggSave();ggUI();
  if(miss.length)toast('חלק מההרשאות לא אושרו ('+miss.map(s=>s.split('/').pop()).join(', ')+'). סמנו את כל התיבות בחלון ההרשאות של Google.',7000);
  if(GG.drive){await ggSync('auto');await ggSyncFiles();}
  render();
  if(!GG.lastErr&&!miss.length)toast('מחובר לחשבון Google'+(GG.email?' ('+GG.email+')':''));
}
function ggDisconnect(){
